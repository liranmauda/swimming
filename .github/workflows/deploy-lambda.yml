# Deploy Lambda (SAM) to AWS when Lambda-related files change.
# Uses OIDC by default; optional: AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY.

name: Deploy Lambda to AWS

on:
  push:
    branches: [main, master]
    paths:
      - 'lambda.js'
      - 'template.yaml'
      - 'results_url_util.js'
      - 'utils.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch: {}  # allow manual run

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  SAM_STACK_NAME: ${{ vars.SAM_STACK_NAME || 'swimming-parse-api' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy SAM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        # If not using OIDC, comment the block above and add:
        #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install SAM CLI
        run: |
          curl -Ls "https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip" -o sam.zip
          unzip -o sam.zip -d sam-install
          sudo ./sam-install/install
          sam --version

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name "${{ env.SAM_STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3
